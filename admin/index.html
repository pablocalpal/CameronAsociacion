<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acceso administración — Asociación cultural Camerón</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/unete.css">
    <link rel="icon" type="image/x-icon" href="../media/logo.png">
    <meta name="color-scheme" content="light dark">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase-config.js"></script>
</head>

<body>
    <main class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="container" style="max-width: 420px;">
            <div class="text-center mb-4">
                <img src="../media/logo.png" alt="Logotipo Asociación" height="50" class="mb-3">
                <h1 class="h3 fw-bold">Panel de administración</h1>
                <p class="text-muted small">Asociación cultural Camerón</p>
            </div>

            <div class="card shadow-sm border-0 p-4">
                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <div class="d-grid">
                        <button type="submit" id="submit-btn" class="btn btn-primary fw-bold">Entrar</button>
                    </div>
                </form>
                <div id="message" class="message mt-3 text-center" aria-live="polite"></div>
            </div>

            <p class="text-center small text-muted mt-3">
                <a href="../index.html" class="link-secondary">← Volver a la web</a>
            </p>
        </div>
    </main>

    <script src="../js/admin-login.js"></script>
</body>

</html>
